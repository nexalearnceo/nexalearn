
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaLearn Withdraw</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #06101d;
      color: #fff;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 230px;
      height: 100vh;
      background: #091827;
      border-right: 1px solid #17283b;
      padding: 25px 15px;
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo h2 {
      color: #3b82f6;
      font-size: 23px;
    }

    .logo p {
      font-size: 10px;
      color: #8392a5;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    .nav a {
      display: block;
      padding: 13px 15px;
      margin-bottom: 7px;
      text-decoration: none;
      color: #aebbc9;
      border-radius: 8px;
      transition: 0.2s;
    }

    .nav a:hover,
    .nav a.active {
      background: #102a45;
      color: #fff;
    }

    .logout {
      position: absolute;
      bottom: 25px;
      left: 15px;
      right: 15px;
    }

    .logout a {
      color: #ef4444;
      text-decoration: none;
      display: block;
      padding: 13px 15px;
    }

    .main {
      margin-left: 230px;
      padding: 35px;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
    }

    .header p {
      color: #8492a4;
      margin-top: 7px;
    }

    .balance-card {
      background: linear-gradient(135deg, #0d2b4d, #0a1b2e);
      border: 1px solid #1b3b5b;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .balance-card span {
      color: #91a1b4;
      font-size: 13px;
    }

    .balance-card h2 {
      font-size: 32px;
      margin-top: 8px;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .card {
      background: #0b1a2b;
      border: 1px solid #17283b;
      border-radius: 12px;
      padding: 25px;
      min-width: 0;
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 19px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      color: #aebbc9;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      background: #071422;
      border: 1px solid #20354b;
      border-radius: 7px;
      color: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #3b82f6;
    }

    .method-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .method-btn {
      padding: 12px;
      background: #071422;
      border: 1px solid #20354b;
      border-radius: 7px;
      color: #aebbc9;
      cursor: pointer;
    }

    .method-btn.active {
      background: #102f50;
      border-color: #3b82f6;
      color: white;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .submit-btn:disabled {
      background: #334155;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #4ade80;
    }

    .message.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
    }

    .request {
      padding: 15px 0;
      border-bottom: 1px solid #17283b;
    }

    .request:last-child {
      border-bottom: none;
    }

    .request-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .request-amount {
      font-size: 17px;
      font-weight: bold;
    }

    .request-date {
      color: #75869a;
      font-size: 11px;
      margin-top: 5px;
    }

    .request-details {
      color: #9aa9ba;
      font-size: 12px;
      margin-top: 9px;
      line-height: 1.6;
    }

    .status {
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
    }

    .status-pending {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
    }

    .status-approved {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .status-rejected {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .admin-note {
      margin-top: 9px;
      padding: 9px;
      background: rgba(239, 68, 68, 0.08);
      border-left: 3px solid #ef4444;
      color: #fca5a5;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: #718096;
      padding: 30px 0;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .content {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
      }

      .logout {
        position: static;
        margin-top: 20px;
      }

      .main {
        margin-left: 0;
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      <h2>NexaLearn</h2>
      <p>LEARN • COMPLETE • EARN</p>
    </div>

    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="packages.html">Packages</a>
      <a href="tasks.html">Tasks</a>
      <a href="wallet.html">Wallet</a>
      <a href="history.html">History</a>
      <a href="profile.html">Profile</a>
      <a href="support.html">Support</a>
      <a href="withdraw.html" class="active">Withdraw</a>
    </div>

    <div class="logout">
      <a href="#" id="logoutBtn">Logout</a>
    </div>

  </aside>

  <main class="main">

    <div class="header">
      <h1>Withdraw Funds</h1>
      <p>
        Request a withdrawal from your NexaLearn account.
      </p>
    </div>

    <div class="balance-card">
      <span>Available Earning Balance</span>
      <h2 id="balance">KES 0.00</h2>
    </div>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <div class="content">

      <!-- WITHDRAWAL FORM -->

      <div class="card">

        <h2>Withdrawal Request</h2>

        <form id="withdrawForm">

          <div class="form-group">
            <label for="accountName">Account Name</label>
            <input
              type="text"
              id="accountName"
              placeholder="Enter account name"
              required
            >
          </div>

          <div class="form-group">
            <label for="amount">Amount (KES)</label>
            <input
              type="number"
              id="amount"
              min="1"
              step="0.01"
              placeholder="Enter amount"
              required
            >
          </div>

          <div class="form-group">
            <label>Withdrawal Method</label>

            <div class="method-buttons">

              <button
                type="button"
                class="method-btn active"
                id="mobileBtn"
              >
                Mobile Money
              </button>

              <button
                type="button"
                class="method-btn"
                id="bankBtn"
              >
                Bank Account
              </button>

            </div>
          </div>

          <!-- MOBILE MONEY -->

          <div class="form-group" id="mobileGroup">

            <label for="mobileNumber">M-Pesa Number</label>

            <input
              type="tel"
              id="mobileNumber"
              placeholder="e.g. 0712345678"
              autocomplete="tel"
            >

          </div>

          <!-- BANK ACCOUNT -->

          <div
            class="form-group"
            id="bankGroup"
            style="display:none;"
          >

            <label for="bankName">Bank Name</label>

            <input
              type="text"
              id="bankName"
              placeholder="Enter bank name"
            >

            <label
              for="bankAccountNumber"
              style="margin-top:12px;"
            >
              Account Number
            </label>

            <input
              type="text"
              id="bankAccountNumber"
              placeholder="Enter account number"
            >

          </div>

          <button
            type="submit"
            class="submit-btn"
            id="submitBtn"
          >
            Submit Withdrawal
          </button>

        </form>

      </div>

      <!-- WITHDRAWAL HISTORY -->

      <div class="card">

        <h2>Withdrawal Requests</h2>

        <div id="requests">
          <div class="empty">
            Loading requests...
          </div>
        </div>

      </div>

    </div>

  </main>

  <script>
    "use strict";

    /* =========================================
       SUPABASE CONFIGURATION
    ========================================= */

    const SUPABASE_URL =
      "https://vzgrzzesquqnftfhchwt.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_G7FZFKxmFb_SfY_94Ix69g_79hu8NwM";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          autoRefreshToken: true,
          persistSession: true,
          detectSessionInUrl: true,

          // Must match login.html, wallet.html and deposit.html
          storageKey: "nexalearn-auth"
        }
      }
    );

    let selectedMethod = "Mobile Money";
    let currentBalance = 0;
    let currentUser = null;


    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(text, type) {
      const message = document.getElementById("message");

      message.textContent = text;
      message.className = "message " + type;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    /* =========================================
       AUTHENTICATION
    ========================================= */

    async function checkUser() {
      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          window.location.replace("login.html");
          return false;
        }

        currentUser = data.session.user;
        return true;

      } catch (error) {
        console.error("Authentication error:", error);

        showMessage(
          "Unable to verify your login session. Please refresh the page.",
          "error"
        );

        return false;
      }
    }


    /* =========================================
       LOAD EARNING BALANCE
    ========================================= */

    async function loadBalance() {
      if (!currentUser) return;

      try {
        const { data: wallet, error } =
          await supabaseClient
            .from("wallets")
            .select("balance")
            .eq("user_id", currentUser.id)
            .maybeSingle();

        if (error) throw error;

        currentBalance = Number(wallet?.balance || 0);

        document.getElementById("balance").textContent =
          "KES " + currentBalance.toFixed(2);

      } catch (error) {
        console.error("Wallet loading error:", error);

        showMessage(
          "Unable to load your earning balance.",
          "error"
        );
      }
    }


    /* =========================================
       SELECT WITHDRAWAL METHOD
    ========================================= */

    function selectMethod(method) {
      selectedMethod = method;

      const mobileBtn = document.getElementById("mobileBtn");
      const bankBtn = document.getElementById("bankBtn");

      const mobileGroup = document.getElementById("mobileGroup");
      const bankGroup = document.getElementById("bankGroup");

      const mobileNumber = document.getElementById("mobileNumber");
      const bankName = document.getElementById("bankName");
      const bankAccountNumber = document.getElementById("bankAccountNumber");

      if (method === "Mobile Money") {

        mobileBtn.classList.add("active");
        bankBtn.classList.remove("active");

        mobileGroup.style.display = "block";
        bankGroup.style.display = "none";

        mobileNumber.required = true;
        bankName.required = false;
        bankAccountNumber.required = false;

      } else {

        bankBtn.classList.add("active");
        mobileBtn.classList.remove("active");

        mobileGroup.style.display = "none";
        bankGroup.style.display = "block";

        mobileNumber.required = false;
        bankName.required = true;
        bankAccountNumber.required = true;
      }
    }

    document.getElementById("mobileBtn").addEventListener(
      "click",
      () => selectMethod("Mobile Money")
    );

    document.getElementById("bankBtn").addEventListener(
      "click",
      () => selectMethod("Bank Account")
    );


    /* =========================================
       SUBMIT WITHDRAWAL
    ========================================= */

    document
      .getElementById("withdrawForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const submitBtn = document.getElementById("submitBtn");

        submitBtn.disabled = true;
        submitBtn.textContent = "Checking balance...";

        try {

          /* VERIFY CURRENT SESSION */

          const { data: sessionData, error: sessionError } =
            await supabaseClient.auth.getSession();

          if (sessionError) throw sessionError;

          if (!sessionData.session) {
            throw new Error(
              "Your login session has expired. Please log in again."
            );
          }

          currentUser = sessionData.session.user;


          /* FORM DATA */

          const accountName = document
            .getElementById("accountName")
            .value.trim();

          const amount = Number(
            document.getElementById("amount").value
          );

          if (!accountName) {
            throw new Error("Please enter the account name.");
          }

          if (
            !Number.isFinite(amount) ||
            amount <= 0
          ) {
            throw new Error("Please enter a valid withdrawal amount.");
          }


          /* GET FRESH EARNING BALANCE */

          submitBtn.textContent = "Checking balance...";

          const { data: wallet, error: walletError } =
            await supabaseClient
              .from("wallets")
              .select("balance")
              .eq("user_id", currentUser.id)
              .maybeSingle();

          if (walletError) throw walletError;

          if (!wallet) {
            throw new Error("Wallet account not found.");
          }

          const balance = Number(wallet.balance || 0);

          currentBalance = balance;

          document.getElementById("balance").textContent =
            "KES " + balance.toFixed(2);


          /* CHECK AVAILABLE BALANCE */

          if (amount > balance) {
            throw new Error(
              "Insufficient earning balance. Available: KES " +
              balance.toFixed(2)
            );
          }


          /* PREPARE WITHDRAWAL DETAILS */

          let mpesaNumber = null;
          let accountNumber = null;


          /* MOBILE MONEY */

          if (selectedMethod === "Mobile Money") {

            mpesaNumber = document
              .getElementById("mobileNumber")
              .value.trim()
              .replace(/[\s-]/g, "");

            if (!/^(?:\+?254|0)\d{9}$/.test(mpesaNumber)) {
              throw new Error(
                "Enter a valid Kenyan M-Pesa number, for example 0712345678."
              );
            }

            accountNumber = mpesaNumber;

          }


          /* BANK ACCOUNT */

          else {

            const bankName = document
              .getElementById("bankName")
              .value.trim();

            const bankAccountNumber = document
              .getElementById("bankAccountNumber")
              .value.trim();

            if (!bankName || !bankAccountNumber) {
              throw new Error(
                "Please enter the bank name and account number."
              );
            }

            accountNumber =
              bankName + " - " + bankAccountNumber;
          }


          /* INSERT WITHDRAWAL REQUEST */

          submitBtn.textContent = "Submitting...";

          const { data: withdrawal, error } =
            await supabaseClient
              .from("withdrawal_requests")
              .insert({
                user_id: currentUser.id,
                amount: amount,
                currency: "KES",
                method: selectedMethod,
                mpesa_number: mpesaNumber,
                account_number: accountNumber,
                account_name: accountName,
                status: "pending"
              })
              .select()
              .single();

          if (error) throw error;

          console.log("Withdrawal created:", withdrawal);


          /* SUCCESS */

          showMessage(
            "Withdrawal request submitted successfully. It is pending admin approval.",
            "success"
          );

          document.getElementById("withdrawForm").reset();

          selectMethod("Mobile Money");

          await loadBalance();
          await loadRequests();

        } catch (error) {

          console.error("Withdrawal submission error:", error);

          showMessage(
            error.message ||
            "Something went wrong while processing your withdrawal.",
            "error"
          );

        } finally {

          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Withdrawal";

        }

      });


    /* =========================================
       LOAD WITHDRAWAL REQUESTS
       Account name and account number are
       deliberately NOT displayed to the user.
    ========================================= */

    async function loadRequests() {

      const requestsContainer =
        document.getElementById("requests");

      if (!currentUser) {
        requestsContainer.innerHTML = `
          <div class="empty">
            Please log in to view your withdrawal requests.
          </div>
        `;
        return;
      }

      requestsContainer.innerHTML = `
        <div class="empty">Loading requests...</div>
      `;

      try {

        const { data, error } =
          await supabaseClient
            .from("withdrawal_requests")
            .select(`
              id,
              amount,
              currency,
              method,
              status,
              admin_note,
              reviewed_at,
              created_at
            `)
            .eq("user_id", currentUser.id)
            .order("created_at", {
              ascending: false
            });

        if (error) throw error;

        if (!data || data.length === 0) {

          requestsContainer.innerHTML = `
            <div class="empty">
              You have no withdrawal requests yet.
            </div>
          `;

          return;
        }

        requestsContainer.innerHTML = data.map(request => {

          const status = String(
            request.status || "pending"
          ).toLowerCase();

          let statusClass = "status-pending";

          if (status === "approved") {
            statusClass = "status-approved";
          } else if (status === "rejected") {
            statusClass = "status-rejected";
          }

          const currency = escapeHtml(
            request.currency || "KES"
          );

          const amount = Number(
            request.amount || 0
          );

          return `
            <div class="request">

              <div class="request-top">

                <div class="request-amount">
                  ${currency} ${amount.toFixed(2)}
                </div>

                <span class="status ${statusClass}">
                  ${escapeHtml(capitalize(status))}
                </span>

              </div>

              <div class="request-date">
                Submitted: ${formatDate(request.created_at)}
              </div>

              <div class="request-details">

                <strong>Method:</strong>
                ${escapeHtml(request.method || "-")}

                ${
                  request.reviewed_at
                    ? `
                      <br>
                      <strong>Reviewed:</strong>
                      ${formatDate(request.reviewed_at)}
                    `
                    : ""
                }

              </div>

              ${
                status === "rejected" && request.admin_note
                  ? `
                    <div class="admin-note">
                      <strong>Admin Note:</strong>
                      <br>
                      ${escapeHtml(request.admin_note)}
                    </div>
                  `
                  : ""
              }

            </div>
          `;

        }).join("");

      } catch (error) {

        console.error("Request loading error:", error);

        requestsContainer.innerHTML = `
          <div class="empty">
            Failed to load withdrawal requests.
            Please refresh the page.
          </div>
        `;
      }
    }


    /* =========================================
       FORMAT DATE
    ========================================= */

    function formatDate(date) {

      if (!date) return "-";

      const parsedDate = new Date(date);

      if (Number.isNaN(parsedDate.getTime())) {
        return "-";
      }

      return parsedDate.toLocaleString("en-KE");
    }


    /* =========================================
       CAPITALIZE STATUS
    ========================================= */

    function capitalize(value) {
      return value.charAt(0).toUpperCase() +
        value.slice(1);
    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================================
       LOGOUT
    ========================================= */

    async function logout() {

      const { error } =
        await supabaseClient.auth.signOut();

      if (error) {

        console.error("Logout error:", error);

        showMessage(
          "Unable to log out. Please try again.",
          "error"
        );

        return;
      }

      window.location.replace("login.html");
    }

    document.getElementById("logoutBtn").addEventListener(
      "click",
      function(event) {
        event.preventDefault();
        logout();
      }
    );


    /* =========================================
       INITIALIZE PAGE
    ========================================= */

    async function initializeWithdrawalPage() {

      const loggedIn = await checkUser();

      if (!loggedIn) return;

      await loadBalance();
      await loadRequests();

    }

    initializeWithdrawalPage();

  </script>

</body>
</html>
