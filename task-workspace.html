<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexaLearn - Task Workspace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #06101d;
    color: #fff;
}

header {
    height: 70px;
    background: #0a1727;
    border-bottom: 1px solid #1d3148;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #4ade80;
}

.back-btn {
    color: #fff;
    text-decoration: none;
    background: #13243a;
    padding: 10px 16px;
    border-radius: 8px;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 20px;
}

.loading,
.error,
.success {
    padding: 25px;
    border-radius: 12px;
    text-align: center;
}

.loading {
    background: #0d1c2e;
}

.error {
    background: #3a1515;
    color: #ffb4b4;
}

.success {
    background: #0c3020;
    color: #7ff0ae;
}

.workspace {
    display: none;
}

.task-header {
    background: #0d1c2e;
    border: 1px solid #1d3148;
    padding: 25px;
    border-radius: 14px;
    margin-bottom: 20px;
}

.task-header h1 {
    margin: 0 0 10px;
    font-size: 26px;
}

.description {
    color: #aebdce;
    line-height: 1.6;
}

.reward {
    margin-top: 15px;
    color: #4ade80;
    font-size: 20px;
    font-weight: bold;
}

.progress-box {
    background: #0d1c2e;
    border: 1px solid #1d3148;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 20px;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    color: #b9c7d7;
    margin-bottom: 10px;
}

.progress-bar {
    height: 10px;
    background: #172a40;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #4ade80;
    transition: width .3s ease;
}

.item-card {
    background: #0d1c2e;
    border: 1px solid #1d3148;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 20px;
}

.item-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 20px;
}

.word-box {
    background: #071522;
    border: 1px solid #243a52;
    border-radius: 10px;
    padding: 25px;
    font-size: 22px;
    margin-bottom: 20px;
    text-align: center;
}

.media-container {
    margin: 20px 0;
    text-align: center;
}

.media-container img {
    max-width: 100%;
    max-height: 500px;
    border-radius: 10px;
}

.audio-box {
    background: #071522;
    border-radius: 10px;
    padding: 20px;
}

audio {
    width: 100%;
}

textarea {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #29415b;
    background: #071522;
    color: #fff;
    font-size: 16px;
    outline: none;
}

textarea:focus {
    border-color: #4ade80;
}

.buttons {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 20px;
}

button {
    border: none;
    cursor: pointer;
    padding: 13px 22px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: bold;
}

.submit-btn {
    background: #4ade80;
    color: #03120a;
}

.submit-btn:hover {
    background: #22c55e;
}

.submit-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.next-btn {
    background: #2563eb;
    color: white;
}

.hidden {
    display: none !important;
}

.balance-box {
    margin-top: 20px;
    padding: 20px;
    background: #071522;
    border-radius: 10px;
    text-align: center;
}

.balance-box strong {
    color: #4ade80;
    font-size: 22px;
}

@media(max-width: 600px) {
    .container {
        padding: 0 12px;
        margin-top: 20px;
    }

    header {
        padding: 0 15px;
    }

    .task-header,
    .item-card,
    .progress-box {
        padding: 18px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">NexaLearn</div>
    <a href="tasks.html" class="back-btn">← Tasks</a>
</header>

<div class="container">

    <div id="loadingBox" class="loading">
        Loading task...
    </div>

    <div id="errorBox" class="error hidden"></div>

    <div id="workspace" class="workspace">

        <div class="task-header">
            <h1 id="taskTitle">Task</h1>
            <div id="taskDescription" class="description"></div>
            <div id="taskReward" class="reward">KSh 50 / task</div>
        </div>

        <div class="progress-box">
            <div class="progress-text">
                <span>Task Progress</span>
                <span id="progressText">0 / 0</span>
            </div>

            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>

        <div class="item-card">

            <div id="itemTitle" class="item-title">
                Item
            </div>

            <div id="wordContainer" class="word-box hidden"></div>

            <div id="imageContainer" class="media-container hidden">
                <img id="taskImage" alt="Task image">
            </div>

            <div id="audioContainer" class="media-container hidden">
                <div class="audio-box">
                    <audio id="taskAudio" controls preload="metadata"></audio>
                </div>
            </div>

            <textarea
                id="answerInput"
                placeholder="Enter your answer here..."
            ></textarea>

            <div class="buttons">
                <button
                    id="submitBtn"
                    class="submit-btn"
                    onclick="submitAnswer()">
                    Submit & Earn KSh 50
                </button>

                <button
                    id="nextBtn"
                    class="next-btn hidden"
                    onclick="nextItem()">
                    Next Item →
                </button>
            </div>

            <div class="balance-box">
                Your Earning Balance
                <br>
                <strong id="earningBalance">KSh 0.00</strong>
            </div>

        </div>

        <div id="successBox" class="success hidden">
            <h2>🎉 Task Completed!</h2>
            <p>Your earnings have been added to your wallet.</p>
            <button class="next-btn" onclick="window.location.href='tasks.html'">
                Back to Tasks
            </button>
        </div>

    </div>
</div>

<script>
const SUPABASE_URL = "https://vzgrzzesquqnftfhchwt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_G7FZFKxmFb_SfY_94Ix69g_79hu8NwM";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let currentTask = null;
let currentItems = [];
let currentItemIndex = 0;
let currentAttempt = null;
let monitoringTimer = null;
let mediaFailureBeingHandled = false;


/* =========================================================
   BASIC HELPERS
========================================================= */

function redirectToTasks() {
    localStorage.removeItem("nexaLearnCurrentTaskId");
    localStorage.removeItem("nexaLearnCurrentTask");

    window.location.replace("tasks.html");
}


function showError(message) {
    document.getElementById("loadingBox").classList.add("hidden");

    const box = document.getElementById("errorBox");

    box.textContent = message;
    box.classList.remove("hidden");

    document.getElementById("workspace").style.display = "none";
}


function formatMoney(value) {
    return Number(value || 0).toLocaleString("en-KE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function getStorageBucket(item) {

    if (!item) {
        return null;
    }

    if (item.content_type === "image") {
        return "images";
    }

    if (
        item.content_type === "audio" ||
        currentTask?.category === "Audio"
    ) {
        return "audio";
    }

    return null;
}


/* =========================================================
   MEDIA VALIDATION
========================================================= */

async function validateMediaItem(item) {

    const bucket = getStorageBucket(item);

    // Normal text item
    if (!bucket) {
        return true;
    }

    // Media item without a storage path is invalid
    if (!item.storage_path) {
        console.warn(
            "Skipping media item with no storage_path:",
            item
        );

        return false;
    }

    try {

        const {
            data,
            error
        } = await supabaseClient
            .storage
            .from(bucket)
            .createSignedUrl(
                item.storage_path,
                60
            );

        if (error || !data?.signedUrl) {

            console.warn(
                "Skipping deleted/missing media:",
                item.storage_path,
                error
            );

            return false;
        }

        return true;

    } catch (error) {

        console.warn(
            "Media validation failed:",
            item.storage_path,
            error
        );

        return false;
    }
}


/* =========================================================
   LOAD TASK
========================================================= */

async function loadTask(taskId) {

    const {
        data,
        error
    } = await supabaseClient
        .from("tasks")
        .select("*")
        .eq("id", taskId)
        .eq("status", "active")
        .maybeSingle();

    if (error) {
        console.error("Task loading error:", error);
        throw error;
    }

    if (!data) {

        const error = new Error(
            "TASK_UNAVAILABLE"
        );

        error.code = "TASK_UNAVAILABLE";

        throw error;
    }

    currentTask = data;

    document.getElementById("taskTitle").textContent =
        data.title || "NexaLearn Task";

    document.getElementById("taskDescription").textContent =
        data.description || "";

    document.getElementById("taskReward").textContent =
        `KSh ${formatMoney(data.reward || 50)} / task`;
}


/* =========================================================
   LOAD AND FILTER ITEMS
========================================================= */

async function loadItems() {

    const {
        data,
        error
    } = await supabaseClient
        .from("task_items")
        .select("*")
        .eq("task_id", currentTask.id)
        .order("item_number", {
            ascending: true
        });

    if (error) {
        console.error("Item loading error:", error);
        throw error;
    }

    const rawItems = data || [];

    const validItems = [];

    for (const item of rawItems) {

        const valid =
            await validateMediaItem(item);

        if (!valid) {

            console.warn(
                "Deleted/missing item skipped:",
                item.id
            );

            continue;
        }

        validItems.push(item);
    }

    currentItems = validItems;

    /*
       If every item has been deleted or every
       media file has been deleted, this task
       should not remain open.
    */

    if (currentItems.length === 0) {

        const error = new Error(
            "TASK_UNAVAILABLE"
        );

        error.code = "TASK_UNAVAILABLE";

        throw error;
    }
}


/* =========================================================
   LOAD USER
========================================================= */

async function loadUser() {

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if (error || !data?.user) {

        window.location.href = "login.html";

        throw new Error("USER_NOT_AUTHENTICATED");
    }

    currentUser = data.user;
}


/* =========================================================
   LOAD EARNING BALANCE
========================================================= */

async function loadBalance() {

    const {
        data,
        error
    } = await supabaseClient
        .from("wallets")
        .select("balance")
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if (error) {

        console.warn(
            "Could not load wallet balance:",
            error
        );

        return;
    }

    document.getElementById(
        "earningBalance"
    ).textContent =
        `KSh ${formatMoney(data?.balance || 0)}`;
}


/* =========================================================
   LOAD / RESUME ATTEMPT
========================================================= */

async function loadAttempt() {

    const {
        data,
        error
    } = await supabaseClient
        .from("task_attempts")
        .select("*")
        .eq("task_id", currentTask.id)
        .eq("user_id", currentUser.id)
        .eq("status", "active")
        .order("created_at", {
            ascending: false
        })
        .limit(1)
        .maybeSingle();

    if (error) {

        console.warn(
            "Attempt loading error:",
            error
        );

        currentAttempt = null;
        return;
    }

    currentAttempt = data || null;

    if (currentAttempt) {

        console.log(
            "Resuming active attempt:",
            currentAttempt.id,
            "saved item:",
            currentAttempt.current_item_number
        );

        const savedNumber =
            Number(
                currentAttempt.current_item_number
            );

        if (savedNumber > 0) {

            const index =
                currentItems.findIndex(
                    item =>
                        Number(item.item_number) === savedNumber
                );

            if (index >= 0) {
                currentItemIndex = index;
            }
        }
    }
}


/* =========================================================
   CREATE ATTEMPT IF NEEDED
========================================================= */

async function createAttempt() {

    if (currentAttempt) {
        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("task_attempts")
        .insert({
            user_id: currentUser.id,
            task_id: currentTask.id,
            status: "active",
            current_item_number:
                currentItems[0]?.item_number || 1
        })
        .select()
        .single();

    if (error) {

        console.error(
            "Could not create attempt:",
            error
        );

        throw error;
    }

    currentAttempt = data;
}


/* =========================================================
   FIND NEXT UNCOMPLETED ITEM
========================================================= */

async function findNextItem() {

    if (!currentAttempt) {
        return currentItemIndex;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("task_completions")
        .select("item_id")
        .eq(
            "attempt_id",
            currentAttempt.id
        );

    if (error) {

        console.warn(
            "Could not load completions:",
            error
        );

        return currentItemIndex;
    }

    const completedIds =
        new Set(
            (data || []).map(
                row => row.item_id
            )
        );

    for (
        let i = 0;
        i < currentItems.length;
        i++
    ) {

        if (
            !completedIds.has(
                currentItems[i].id
            )
        ) {
            return i;
        }
    }

    return currentItems.length;
}


/* =========================================================
   SAVE CURRENT ITEM
========================================================= */

async function saveCurrentItemNumber() {

    if (!currentAttempt) {
        return;
    }

    const item =
        currentItems[currentItemIndex];

    if (!item) {
        return;
    }

    const {
        error
    } = await supabaseClient
        .from("task_attempts")
        .update({
            current_item_number:
                item.item_number
        })
        .eq(
            "id",
            currentAttempt.id
        );

    if (error) {

        console.warn(
            "Could not save current item:",
            error
        );

    } else {

        console.log(
            "Saved current item number:",
            item.item_number
        );
    }
}


/* =========================================================
   DISPLAY ITEM
========================================================= */

async function displayItem() {

    if (
        currentItemIndex >=
        currentItems.length
    ) {

        await finishAttempt();

        return;
    }

    const item =
        currentItems[currentItemIndex];

    if (!item) {

        redirectToTasks();

        return;
    }

    const visibleNumber =
        currentItemIndex + 1;

    const total =
        currentItems.length;

    document.getElementById(
        "progressText"
    ).textContent =
        `${visibleNumber} / ${total}`;

    document.getElementById(
        "progressFill"
    ).style.width =
        `${(visibleNumber / total) * 100}%`;

    document.getElementById(
        "itemTitle"
    ).textContent =
        `Item ${visibleNumber} of ${total}`;

    document.getElementById(
        "answerInput"
    ).value = "";

    document.getElementById(
        "wordContainer"
    ).classList.add("hidden");

    document.getElementById(
        "imageContainer"
    ).classList.add("hidden");

    document.getElementById(
        "audioContainer"
    ).classList.add("hidden");

    const image =
        document.getElementById("taskImage");

    image.removeAttribute("src");

    const audio =
        document.getElementById("taskAudio");

    audio.pause();
    audio.removeAttribute("src");
    audio.load();

    /*
       TEXT ITEM
    */

    if (
        !getStorageBucket(item) &&
        item.content
    ) {

        document.getElementById(
            "wordContainer"
        ).textContent =
            item.content;

        document.getElementById(
            "wordContainer"
        ).classList.remove("hidden");
    }

    /*
       IMAGE ITEM
    */

    if (
        getStorageBucket(item) === "images"
    ) {

        try {

            const {
                data,
                error
            } = await supabaseClient
                .storage
                .from("images")
                .createSignedUrl(
                    item.storage_path,
                    3600
                );

            if (
                error ||
                !data?.signedUrl
            ) {

                await handleMissingMediaItem(
                    item
                );

                return;
            }

            image.onerror = async () => {

                await handleMissingMediaItem(
                    item
                );
            };

            image.src =
                data.signedUrl;

            document.getElementById(
                "imageContainer"
            ).classList.remove("hidden");

        } catch (error) {

            await handleMissingMediaItem(
                item
            );

            return;
        }
    }

    /*
       AUDIO ITEM
    */

    if (
        getStorageBucket(item) === "audio"
    ) {

        try {

            const {
                data,
                error
            } = await supabaseClient
                .storage
                .from("audio")
                .createSignedUrl(
                    item.storage_path,
                    3600
                );

            if (
                error ||
                !data?.signedUrl
            ) {

                await handleMissingMediaItem(
                    item
                );

                return;
            }

            audio.onerror = async () => {

                await handleMissingMediaItem(
                    item
                );
            };

            audio.src =
                data.signedUrl;

            audio.load();

            document.getElementById(
                "audioContainer"
            ).classList.remove("hidden");

        } catch (error) {

            await handleMissingMediaItem(
                item
            );

            return;
        }
    }

    await saveCurrentItemNumber();
}


/* =========================================================
   HANDLE DELETED/MISSING MEDIA
========================================================= */

async function handleMissingMediaItem(item) {

    if (mediaFailureBeingHandled) {
        return;
    }

    mediaFailureBeingHandled = true;

    console.warn(
        "Removing unavailable item:",
        item.id,
        item.storage_path
    );

    const index =
        currentItems.findIndex(
            x => x.id === item.id
        );

    if (index === -1) {

        mediaFailureBeingHandled = false;

        return;
    }

    /*
       Remove it from the local workspace
       immediately.
    */

    currentItems.splice(
        index,
        1
    );

    /*
       If the deleted item was before
       the current position, adjust index.
    */

    if (
        index < currentItemIndex
    ) {

        currentItemIndex--;

    } else if (
        index === currentItemIndex
    ) {

        /*
           Keep the same index because
           the next item moves into it.
        */
    }

    /*
       No valid items remain.
    */

    if (
        currentItems.length === 0
    ) {

        mediaFailureBeingHandled = false;

        redirectToTasks();

        return;
    }

    if (
        currentItemIndex >=
        currentItems.length
    ) {

        currentItemIndex =
            currentItems.length - 1;
    }

    mediaFailureBeingHandled = false;

    await displayItem();
}


/* =========================================================
   SUBMIT ANSWER
========================================================= */

async function submitAnswer() {

    const answer =
        document.getElementById(
            "answerInput"
        ).value.trim();

    if (!answer) {

        alert(
            "Please enter your answer first."
        );

        return;
    }

    if (!currentAttempt) {

        alert(
            "Your task session is not ready. Please reload the page."
        );

        return;
    }

    const item =
        currentItems[currentItemIndex];

    if (!item) {

        redirectToTasks();

        return;
    }

    const button =
        document.getElementById(
            "submitBtn"
        );

    button.disabled = true;

    button.textContent =
        "Submitting...";

    try {

        /*
           Record attempt
        */

        const {
            error: attemptError
        } = await supabaseClient
            .from("task_attempts")
            .update({
                current_item_number:
                    item.item_number
            })
            .eq(
                "id",
                currentAttempt.id
            );

        if (attemptError) {
            throw attemptError;
        }

        /*
           Complete item and reward user.
        */

        const {
            data,
            error
        } = await supabaseClient
            .rpc(
                "complete_task_and_reward",
                {
                    p_task_id:
                        currentTask.id,

                    p_item_id:
                        item.id,

                    p_attempt_id:
                        currentAttempt.id,

                    p_answer:
                        answer
                }
            );

        if (error) {

            console.error(
                "Reward RPC error:",
                error
            );

            throw error;
        }

        console.log(
            "Task completion result:",
            data
        );

        document.getElementById(
            "answerInput"
        ).value = "";

        await loadBalance();

        document.getElementById(
            "submitBtn"
        ).classList.add("hidden");

        document.getElementById(
            "nextBtn"
        ).classList.remove("hidden");

    } catch (error) {

        console.error(
            "Submit error:",
            error
        );

        alert(
            error?.message ||
            "Unable to submit this task. Please try again."
        );

        button.disabled = false;

        button.textContent =
            "Submit & Earn KSh 50";
    }
}


/* =========================================================
   NEXT ITEM
========================================================= */

async function nextItem() {

    document.getElementById(
        "submitBtn"
    ).classList.remove("hidden");

    document.getElementById(
        "nextBtn"
    ).classList.add("hidden");

    document.getElementById(
        "submitBtn"
    ).disabled = false;

    document.getElementById(
        "submitBtn"
    ).textContent =
        "Submit & Earn KSh 50";

    /*
       Find next unfinished item.
    */

    const next =
        await findNextItem();

    if (
        next >= currentItems.length
    ) {

        await finishAttempt();

        return;
    }

    currentItemIndex = next;

    await displayItem();
}


/* =========================================================
   FINISH ATTEMPT
========================================================= */

async function finishAttempt() {

    if (currentAttempt) {

        const {
            error
        } = await supabaseClient
            .from("task_attempts")
            .update({
                status: "completed"
            })
            .eq(
                "id",
                currentAttempt.id
            );

        if (error) {

            console.warn(
                "Could not mark attempt completed:",
                error
            );
        }
    }

    document.getElementById(
        "workspace"
    ).style.display = "block";

    document.querySelector(
        ".item-card"
    ).classList.add("hidden");

    document.getElementById(
        "successBox"
    ).classList.remove("hidden");

    await loadBalance();
}


/* =========================================================
   MONITOR TASK FOR ADMIN DELETION
========================================================= */

function startTaskMonitor() {

    if (monitoringTimer) {
        clearInterval(
            monitoringTimer
        );
    }

    monitoringTimer =
        setInterval(
            async () => {

                if (!currentTask?.id) {
                    return;
                }

                try {

                    /*
                       Check whether the task
                       itself still exists.
                    */

                    const {
                        data: task,
                        error: taskError
                    } = await supabaseClient
                        .from("tasks")
                        .select("id,status")
                        .eq(
                            "id",
                            currentTask.id
                        )
                        .maybeSingle();

                    if (!taskError) {

                        if (
                            !task ||
                            task.status !== "active"
                        ) {

                            redirectToTasks();

                            return;
                        }
                    }

                    /*
                       Check the current item.
                    */

                    const item =
                        currentItems[
                            currentItemIndex
                        ];

                    if (!item) {
                        return;
                    }

                    const {
                        data: freshItem,
                        error: itemError
                    } = await supabaseClient
                        .from("task_items")
                        .select(
                            "id,storage_path,content_type"
                        )
                        .eq(
                            "id",
                            item.id
                        )
                        .maybeSingle();

                    if (!itemError) {

                        /*
                           Admin deleted the
                           task item.
                        */

                        if (!freshItem) {

                            await handleMissingMediaItem(
                                item
                            );

                            return;
                        }

                        /*
                           Admin deleted the
                           media file.
                        */

                        if (
                            getStorageBucket(
                                freshItem
                            )
                        ) {

                            const valid =
                                await validateMediaItem(
                                    freshItem
                                );

                            if (!valid) {

                                await handleMissingMediaItem(
                                    item
                                );
                            }
                        }
                    }

                } catch (error) {

                    /*
                       Do not kick the user out because
                       of a temporary network error.
                    */

                    console.warn(
                        "Task monitor error:",
                        error
                    );
                }

            },
            10000
        );
}


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize() {

    try {

        /*
           Get task ID.
        */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const taskId =
            params.get("id") ||
            localStorage.getItem(
                "nexaLearnCurrentTaskId"
            );

        if (!taskId) {

            redirectToTasks();

            return;
        }

        /*
           Check authentication.
        */

        await loadUser();

        /*
           Load task.
        */

        await loadTask(
            taskId
        );

        /*
           Load only valid items.
        */

        await loadItems();

        /*
           Load/resume attempt.
        */

        await loadAttempt();

        /*
           Create attempt if none exists.
        */

        await createAttempt();

        /*
           Find first unfinished item.
        */

        const next =
            await findNextItem();

        if (
            next >= currentItems.length
        ) {

            await finishAttempt();

        } else {

            currentItemIndex = next;

            document.getElementById(
                "loadingBox"
            ).classList.add("hidden");

            document.getElementById(
                "workspace"
            ).style.display = "block";

            await displayItem();

            await loadBalance();

            startTaskMonitor();
        }

        console.log(
            "Workspace initialized:",
            {
                task: currentTask,
                items: currentItems.length,
                attempt: currentAttempt
            }
        );

    } catch (error) {

        console.error(
            "Workspace initialization error:",
            error
        );

        /*
           Missing/deleted/inactive task:
           silently leave the workspace.
        */

        if (
            error?.code ===
            "TASK_UNAVAILABLE" ||
            error?.message ===
            "TASK_UNAVAILABLE"
        ) {

            redirectToTasks();

            return;
        }

        /*
           Authentication errors are handled
           by loadUser().
        */

        if (
            error?.message ===
            "USER_NOT_AUTHENTICATED"
        ) {

            return;
        }

        /*
           Only show this for genuine
           connection/application errors.
        */

        showError(
            "The task workspace could not connect to Supabase. Please check your internet connection and reload the page."
        );
    }
}


/* =========================================================
   START
========================================================= */

initialize();

</script>
